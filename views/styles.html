<style>
	@media (prefers-reduced-motion: no-preference) {
		@view-transition {
			navigation: auto;
		}
	}

	@font-face {
		font-family: "Noto Sans Devanagari";
		src: url("/static/NotoSansDevanagari-VariableFont_wdth\,wght.woff2") format("woff2");
		font-weight: 100 900;
		font-display: swap;
	}

	* {
		padding: 0;
		margin: 0;
		box-sizing: border-box;
		scroll-behavior: smooth;
	}

	:root {
		color-scheme: light dark;

		--background: #ebe6df;
		--surface: #f6f2ec;
		--surface-2: #e4ddd4;
		--heading: #2b2825;
		--content: #433f3a;
		--ignore: #5b554f;
		--border: #b9afa2;
		--attention: #6f4c22;
		--attention-hover: #573a18;
		--green-text: #556b2f;
		--reply-text: #48627e;

		--background-dark: #121314;
		--surface-dark: #1b1c1d;
		--surface-2-dark: #242628;
		--heading-dark: #dad9d8;
		--content-dark: #c6c4c3;
		--ignore-dark: #aaaaaa;
		--border-dark: #424548;
		--attention-dark: #d2ae67;
		--attention-hover-dark: #e3bc72;
		--green-text-dark: #9fb96b;
		--reply-text-dark: #9cb8d8;
	}

	.greenText {
		color: light-dark(var(--green-text), var(--green-text-dark));
	}

	.replyLink {
		color: light-dark(var(--reply-text), var(--reply-text-dark));
	}

	body {
		background-color: light-dark(var(--background), var(--background-dark));
		font-family: "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", ".KohinoorDeVN", "Mangal";
		line-height: 1.6;
		min-height: 100vh;
		text-rendering: optimizeLegibility;
	}

	h1,
	h2,
	h3,
	h4,
	h5,
	h6 {
		color: light-dark(var(--heading), var(--heading-dark));
	}

	a {
		color: light-dark(var(--attention), var(--attention-dark));
		text-decoration: none;

		&:hover {
			color: light-dark(var(--attention-hover), var(--attention-hover-dark));
		}
	}

	button {
		color: light-dark(var(--attention), var(--attention-dark));
		border: none;
		font-size: 1rem;
		padding: 6px;
		border-radius: 4px;
		box-shadow: none;
		cursor: pointer;
		font-family: inherit;
		background-color: transparent;
		/* for tab outline color */
		outline-color: light-dark(var(--content), var(--content-dark));

		&:hover {
			color: light-dark(var(--attention-hover), var(--attention-hover-dark));
			background-color: light-dark(var(--surface-2), var(--surface-2-dark));
		}
	}

	.sageLabel {
		color: light-dark(var(--attention), var(--attention-dark));
		font-size: 1rem;
		padding: 6px;
		margin-right: 8px;
		border-radius: 4px;
		cursor: pointer;
		font-family: inherit;
		background-color: transparent;
		/* for tab outline color */
		outline-color: light-dark(var(--content), var(--content-dark));

		&:hover {
			color: light-dark(var(--attention-hover), var(--attention-hover-dark));
			background-color: light-dark(var(--surface-2), var(--surface-2-dark));
		}
	}

	#sage:checked+.sageLabel {
		color: light-dark(var(--heading), var(--heading-dark));
		background-color: color-mix(in srgb, light-dark(var(--attention), var(--attention-dark)) 14%, light-dark(var(--surface), var(--surface-dark)));
		border-color: light-dark(var(--attention), var(--attention-dark));
		box-shadow:
			0 0 12px color-mix(in srgb, light-dark(var(--attention), var(--attention-dark)) 55%, transparent),
			0 0 24px color-mix(in srgb, light-dark(var(--attention), var(--attention-dark)) 25%, transparent);
		text-shadow: 0 0 8px color-mix(in srgb, light-dark(var(--attention), var(--attention-dark)) 60%, transparent);
	}


	input[type="text"],
	textarea {
		font-size: 1rem;
		padding: 8px;
		border: 1px solid light-dark(var(--border), var(--border-dark));
		background-color: light-dark(var(--surface), var(--surface-dark));
		color: light-dark(var(--content), var(--content-dark));
		font-family: inherit;
		border-radius: 4px;
		width: 100%;
		outline-color: light-dark(var(--content), var(--content-dark));
	}

	.newPostWindow {
		/* background-color: light-dark(var(--surface), var(--surface-dark)); */
		backdrop-filter: blur(10px);
		padding: 0.8rem;
		width: 100%;
		border-radius: 6px;

		button {
			margin-right: 8px;
		}

		textarea {
			height: 8rem;
			resize: vertical;
		}

		input[type="text"] {
			margin-bottom: 8px;
		}
	}

	.fileName {
		font-size: 0.9rem;
		color: light-dark(var(--ignore), var(--ignore-dark));
	}

	@keyframes appear {
		0% {
			/* opacity: 0; */
			transform: translateY(-10px);
		}

		100% {
			/* opacity: 1; */
			transform: translateY(0px);
		}
	}

	.hidden {
		display: none !important;
	}

	.formbtn {
		display: flex;
		justify-content: end;
	}

	.overlay {
		position: fixed;
		inset: 0;
		z-index: 2;
	}

	.popup {
		position: absolute;
		border: 2px dashed red;
		max-height: 300px;
		overflow-y: scroll;
	}

	.boardname {
		text-align: center;
	}



	.thumbnail {
		display: block;
		margin: 0 12px 0px 0;
		float: left;
		border-radius: 6px;
		cursor: pointer;
		filter: grayscale(10%) brightness(0.9);
	}

	.thumbnail__button {
		display: flex;
		justify-content: center;
	}

	.thumbnail--expanded {
		margin: 0;
		float: none;
		max-width: 100%;
		width: 100%;
		object-fit: contain;
		max-height: 60vh;
		margin-bottom: 0.6rem;
		filter: none;
	}

	.thumbnail--removed {
		display: none;
	}

	.post-list {
		display: flex;
		flex-direction: column;
		gap: 1rem;
		/* margin-bottom: 350px; */
	}

	.post-list--scroll {
		height: calc(100vh - 16px);
		overflow-y: scroll;
		scrollbar-width: none;
	}

	/* smaller gap for thread */
	.post-list--thread {
		gap: 1rem;
	}

	.post {
		width: 100%;
		/* animation: appear 150ms ease-in forwards; */
		border-radius: 6px;
		display: flow-root;
		background-color: light-dark(var(--surface), var(--surface-dark));
		/* hindi text has more space at bottom , so margin to make balance */
		padding: 1rem;
		position: relative;
	}

	.post__header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		color: light-dark(var(--ignore), var(--ignore-dark));
		font-size: 0.9rem;
		margin-bottom: 0.4rem;
		flex-wrap: wrap;
	}

	.post__meta {
		display: flex;
		/* flex-wrap: wrap; */
		gap: 0.5rem;
		/* for large names */
		overflow-wrap: anywhere;
	}

	.post__pin {
		fill: light-dark(var(--ignore), var(--ignore-dark));
	}

	.post__lock {
		stroke: light-dark(var(--ignore), var(--ignore-dark));
	}

	.post__menu-icon {
		fill: light-dark(var(--ignore), var(--ignore-dark));
		cursor: pointer;
	}

	.post__menu {
		position: relative;
	}

	.post__menu-list {
		position: absolute;
		list-style: none;
		color: inherit;
    	width: 100px;
    	z-index: 2;
		list-style: none;
		background-color: light-dark(var(--surface-2), var(--surface-2-dark));
		border-radius: 4px;
		/* pointer-events: none; */

		& > li {
			padding: 0.2rem;
			margin : 0.2rem 0.4rem;
			/* text-align: center	; */
			cursor: pointer;
		}
	}

	.post__link {
		color: inherit;
		flex-grow: 0;
		flex-shrink: 0;

	}

	.post__link:after {
		position: absolute;
		content: "";
		inset: 0;
		z-index: 3;
	}

	.post__reply {
		/* prevent wrapping of word */
		white-space: nowrap;
		cursor: pointer;
		color: light-dark(var(--attention), var(--attention-dark));
	}

	.post__title-content-wrapper {
		/* margin-bottom: 0.5rem; */
		/* hindi text has more space at bottom , so margin to make balance */
		/* margin: 0.5rem 0 0.7rem;  */
	}

	.post__title-content-wrapper::after {
		content: "";
		clear: both;
		display: table;
	}

	.post__title {
		font-size: 1.1rem;
		text-decoration: none;
		color: light-dark(var(--heading), var(--heading-dark));
		font-weight: 600;
	}

	.post__content {
		color: light-dark(var(--content), var(--content-dark));
		font-size: 1rem;
		overflow-wrap: anywhere;
	}

	.post__content--pre-wrap {
		/* no wrap on boards */
		white-space: pre-wrap;
	}

	.post__content--pre-line {
		/* no wrap on boards */
		white-space: pre-line;
	}

	.post__footer {
		clear: both;
		color: light-dark(var(--ignore), var(--ignore-dark));
		font-size: 0.9rem;
		margin-top: 0.6rem;
	}

	.board-feed {
		display: flex;
		flex-direction: column;
		width: 100%;
		max-width: 72rem;
		margin: auto;
	}

	.board-feed__sidebar{
		padding: 0.4rem;
	}

	/* dont display on mobile */
	.board-feed__column--new {
		display: none;
	}

	.sticky {
		position: sticky;
		top: 8px;
	}

	/* links to all boards */
	.board-list {
		border-radius: 8px;
		padding: 0.5rem;
		background-color: light-dark(var(--surface), var(--surface-dark));
		font-size: 0.9rem;
	}

	.board-list__items {
		list-style: none;
		text-align: center;
	}

	.board-list__item {
		display: inline-block;
		margin-right: 0.5rem;
	}

	/* Styles the element only when it is the active URL fragment */
	:target {
		border: 2px dashed red;
		transition: background-color 0.5s ease;
	}

	img:not([src]) {
		visibility: hidden;
	}

	@media (min-width : 900px) {

		.lara-image {
			display: block;
		}

		.popup {
			width: 600px;
		}

		.board-feed {
			flex-direction: row;
			/* gap: 0.5rem; */
		}

		.board-feed__sidebar {
			order: 0;
			width: 10.5rem;
		}

		.board-feed__column {
			padding: 0.5rem;
		}

		.board-feed__column--hot {
			order: 1;
			flex: 1 0 18.25rem;
		}

		.board-feed__column--new {
			order: 2;
			flex: 1 0 18.25rem;
			max-width: 22rem;
			display: block;
		}
	}
</style>
