<style>

	@font-face {
		font-family: "Noto Sans Devanagari";
		src: url("/www/NotoSansDevanagari-Regular.woff2") format("woff2");
		font-weight: 400;
		font-style: normal;
		font-display: swap;
	}

	@font-face {
		font-family: "Noto Sans Devanagari";
		src: url("/www/NotoSansDevanagari-SemiBold.woff2") format("woff2");
		font-weight: 600;
		font-style: normal;
		font-display: swap;
	}

	* {
		padding: 0;
		margin: 0;
		box-sizing: border-box;
		scroll-behavior: smooth;
	}

	:root {
		color-scheme: light dark;

		--background: #ebe6df;
		--surface: #f6f2ec;
		--surface-2: #e4ddd4;
		--heading: #2b2825;
		--content: #433f3a;
		--ignore: #5b554f;
		--border: #b9afa2;
		--attention: #6f4c22;
		--attention-hover: #573a18;
		--green-text: #556b2f;
		--reply-text: #48627e;

		--background-dark: #121314;
		--surface-dark: #1b1c1d;
		--surface-2-dark: #242628;
		--heading-dark: #dad9d8;
		--content-dark: #c6c4c3;
		--ignore-dark: #aaaaaa;
		--border-dark: #424548;
		--attention-dark: #d2ae67;
		--attention-hover-dark: #e3bc72;
		--green-text-dark: #9fb96b;
		--reply-text-dark: #9cb8d8;
	}

	.greenText {
		color: light-dark(var(--green-text), var(--green-text-dark));
	}

	.replyText {
		color: light-dark(var(--reply-text), var(--reply-text-dark));
	}

	body {
		background-color: light-dark(var(--background), var(--background-dark));
		font-family: "Noto Sans Devanagari", Arial, sans-serif;
		font-optical-sizing: auto;
		font-style: normal;
		font-variation-settings: "wdth" 100;
		line-height: 1.6;
		min-height: 100vh;
		text-rendering: optimizeLegibility;
	}

	h1,
	h2,
	h3,
	h4,
	h5,
	h6 {
		color: light-dark(var(--heading), var(--heading-dark));
	}

	a {
		color: light-dark(var(--attention), var(--attention-dark));
		text-decoration: none;

		&:hover {
			color: light-dark(var(--attention-hover), var(--attention-hover-dark));
		}
	}

	button {
		color: light-dark(var(--attention), var(--attention-dark));
		border: none;
		font-size: 1rem;
		padding: 6px;
		border-radius: 4px;
		box-shadow: none;
		cursor: pointer;
		font-family: inherit;
		background-color: transparent;

		&:hover {
			color: light-dark(var(--attention-hover), var(--attention-hover-dark));
			background-color: light-dark(var(--surface-2), var(--surface-2-dark));
		}
	}

	input,
	textarea {
		font-size: 1.025rem;
		padding: 8px;
		border: 1px solid light-dark(var(--border), var(--border-dark));
		background-color: light-dark(var(--surface), var(--surface-dark));
		color: light-dark(var(--content), var(--content-dark));
		font-family: inherit;
		border-radius: 4px;
		width: 100%;
	}

	label {
		color: light-dark(var(--heading), var(--heading-dark));
	}


	.index {
		text-align: center;
	}

	.board-heading {
		margin: 1rem 0;
		text-align: center;
	}

	.board-heading__desc {
		color: light-dark(var(--content), var(--content-dark));
	}


	.newPostWindow {
		background-color: light-dark(var(--surface), var(--surface-dark));
		padding: 16px;
		width: 100%;

		button {
			margin-right: 8px;
		}

		textarea {
			height: 125px;
			resize: vertical;
		}

		input {
			margin-bottom: 8px;
		}
	}

	.fileName {
		font-size: 0.9rem;
		color: light-dark(var(--ignore), var(--ignore-dark));
	}

	@keyframes appear {
		0% {
			/* opacity: 0; */
			transform: translateY(-10px);
		}

		100% {
			/* opacity: 1; */
			transform: translateY(0px);
		}
	}

	.hidden {
		display: none !important;
	}

	.formbtn {
		display: flex;
		justify-content: end;
	}

	.overlay {
		position: fixed;
		inset: 0;
		z-index: 2;
	}

	.popup {
		position: absolute;
		border: 2px dashed red;
		pointer-events: none;
	}



	.thumbnail {
		display: block;
		margin: 0 12px 0 0;
		float: left;
		max-width: 100px;
		border-radius: 6px;
		cursor: pointer;
		filter: grayscale(15%) brightness(0.85);
	}

	.thumbnail--expanded {
		margin: 0;
		float: none;
		max-width: 100%;
		width: 100%;
		object-fit: contain;
		max-height: 60vh;
		margin-bottom: 0.5rem;
		filter: none;
	}

	.thumbnail--removed {
		display: none;
	}

	.post-list {
		display: flex;
		flex-direction: column;
		gap: 1.25rem;
		/* margin-bottom: 350px; */
	}

	.post-list--scroll {
		height: calc(100vh - 16px);
		overflow-y: scroll;
		scrollbar-width: none;
	}

	/* smaller gap for thread */
	.post-list--thread {
		gap: 0.8rem;
	}

	.post {
		width: 100%;
		/* animation: appear 150ms ease-in forwards; */
		border-radius: 6px;
		display: flow-root;
		background-color: light-dark(var(--surface), var(--surface-dark));
		padding: 1rem;
		position: relative;
	}

	.post__header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		color: light-dark(var(--ignore), var(--ignore-dark));
		font-size: 0.925rem;
		margin-bottom: 0.5rem;
	}

	.post__meta {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
	}

	.post__link {
		color: inherit;
		flex-grow: 0;
		flex-shrink: 0;
	}

	.post__link:after {
		position: absolute;
		content: "";
		inset: 0;
		z-index: 3;
	}

	.post__reply {

		background-color: transparent;
		padding: 2px;
		font-family: inherit;
		color: light-dark(var(--attention), var(--attention-dark));

		&:hover {
			background-color: rgba(0, 0, 0, 0.1);
		}
	}

	.post__title {
		font-size: 1.125rem;
		text-decoration: none;
		color: light-dark(var(--heading), var(--heading-dark));
		font-weight: 600;
	}

	.post__content {
		color: light-dark(var(--content), var(--content-dark));
		font-size: 1.025rem;
		overflow-wrap: break-word;
		word-break: keep-all;
		margin-bottom: 0.5rem;
	}

	.post__content--pre-wrap {
		/* no wrap on boards */
		white-space: pre-wrap;
	}

	.post__content--pre-line {
		/* no wrap on boards */
		white-space: pre-line;
	}

	.post__footer {
		clear: both;
		color: light-dark(var(--ignore), var(--ignore-dark));
		font-size: 0.925rem;
		padding-top: 0.5rem;
	}

	.board-feed {
		display: flex;
		flex-direction: column;
		width: 100%;
		max-width: 72rem;
		margin: auto;
	}

	.board-feed__sidebar,
	.board-feed__column {
		padding: 0.5rem;
	}

	/* dont display on mobile */
	.board-feed__column--new {
		display: none;
	}

	.sticky {
		position: sticky;
		top: 8px;
	}

	/* links to all boards */
	.board-list {
		border-radius: 8px;
		padding: 0.5rem;
		background-color: light-dark(var(--surface), var(--surface-dark));
		font-size: 0.925rem;
	}

	.board-list__items {
		list-style: none;
		text-align: center;
	}

	.board-list__item {
		display: inline-block;
		margin-right: 0.5rem;
	}

	/* Styles the element only when it is the active URL fragment */
	:target {
		border: 2px dashed red;
		transition: background-color 0.5s ease;
	}

	.lara-image {
		width: 100%;
		object-fit: contain;
		border-radius: 6px;
		display: none;
		filter: grayscale(15%) brightness(0.85);
		margin-top: 8px;
	}



	@media (min-width : 900px) {

		.lara-image {
			display: block;
		}

		.popup {
			width: 600px;
		}

		.board-feed {
			flex-direction: row;
			gap: 0.5rem;
		}

		.board-feed__sidebar {
			order: 0;
			width: 10.5rem;
		}

		.board-feed__column--hot {
			order: 1;
			flex: 1 0 18.25rem;
		}

		.board-feed__column--new {
			order: 2;
			flex: 1 0 18.25rem;
			max-width: 22rem;
			display: block;
		}
	}
</style>
