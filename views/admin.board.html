<h1>Update / Delete Boards</h1>
{% for board in boards %}
	<form id="form-{{board.id}}">
		<input type="number" name="id" value="{{board.id}}">
		<input type="text" name="name" placeholder="name for route" value="{{board.name}}">
		<input type="text" name="title" placeholder="title in hindi" value="{{board.title}}">
		<textarea rows="5" name="rules" placeholder="rules in hindi">{{board.rules}}</textarea>
		locked : <input type="number" name="locked" value="{{board.locked}}">
		order_number : <input type="number" name="order_number" value="{{board.order_number}}">
		<input type="text" name="owner_name" placeholder="owner name with trip code or ADMIN" value="{{board.owner_name}}">
		<button class="updatebtn" type="button" data-id="{{board.id}}">Update</button>
		<button class="deletebtn" type="button" data-id="{{board.id}}">Delete</button>
	</form>
{% endfor %}


<script>

	

	function handler(promise){
		promise.then(async res => {
			let response = await res.json()
			if (!res.ok) throw new Error(response.message);
			return response
		})
		.then(res => {
			alert("success : " + res.changes)
		})
		.catch(res => alert(res.message))
	}

	function updateBoard(event, form) {
		event.preventDefault()
		let result = new URLSearchParams(new FormData(form));
		let promise = fetch("/boards/" + result.get("id")  , {
			method: "PUT",
			headers: {
				"Content-Type" : 'application/x-www-form-urlencoded'
			},
			body: result
		})
		handler(promise)
	}

	function deleteBoard(event, form) {
		event.preventDefault()
		let result = new URLSearchParams(new FormData(form));
		let promise = fetch("/boards/" +  result.get("id"), {
			method: "DELETE"
		})
		handler(promise)
	}

	document.querySelectorAll(".updatebtn").forEach(btn => {
		btn.addEventListener("click", (e) => {
			let form = this.document.getElementById("form-" + btn.dataset.id)
			updateBoard(e, form)
		})
	})

	document.querySelectorAll(".deletebtn").forEach(btn => {
		btn.addEventListener("click", (e) => {
			let form = this.document.getElementById("form-" + btn.dataset.id)
			if(confirm("delete board")) {
				deleteBoard(e, form)
			}
		})
	})
