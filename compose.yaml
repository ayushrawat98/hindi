services:
  app:
    build: .
    container_name: my-node-app
    restart: unless-stopped

    ports:
      - "127.0.0.1:80:80"

    environment:
      FFMPEG_PATH: ffmpeg
      NODE_ENV: development
      PORT: 80

    volumes:
      - ./database:/app/database
      - ./public:/app/public
      - ./static:/app/static